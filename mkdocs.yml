# ==============================================================================
# Holberton ML Handbook
#
# Two things to know before editing:
#
#   1. `nav` controls what is LINKED. `exclude_docs` controls what is BUILT.
#      A page removed from nav but not excluded is still published and still
#      turns up in search. To release a module you must edit BOTH.
#
#   2. Release ritual (takes 30 seconds):
#        - delete the module's line from `exclude_docs`
#        - uncomment its block in `nav`
#        - commit, push, deploy
# ==============================================================================

site_name: Holberton ML Handbook
site_description: >-
  A practical, project-based machine learning curriculum for Holberton School
  Albania. Real projects, real skills, real careers.
site_url: https://evisp.github.io/ml-handbook/
site_author: Evis Plaku

repo_url: https://github.com/evisp/ml-handbook
repo_name: evisp/ml-handbook
edit_uri: edit/main/docs/

copyright: Holberton School Albania

# ------------------------------------------------------------------------------
# Theme
# ------------------------------------------------------------------------------

theme:
  name: material
  language: en

  # Uncomment once you have dropped the brand assets into docs/assets/.
  # Referencing a file that does not exist gives you a broken image in the header.
  # logo: assets/logo.svg
  # favicon: assets/favicon.png

  font:
    text: Host Grotesk     # brand primary typeface, available on Google Fonts
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom      # values come from docs/stylesheets/brand.css
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes      # section landing pages use the section's index.md
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

# ------------------------------------------------------------------------------
# Assets
# ------------------------------------------------------------------------------

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # polyfill.io was removed on purpose: that domain was sold and began serving
  # malicious redirects. MathJax 3 does not need it.

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evisp
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/school/holbertonschool/
      name: Holberton School

# ------------------------------------------------------------------------------
# Markdown
# ------------------------------------------------------------------------------

markdown_extensions:
  - abbr
  - admonition
  - attr_list           # required for badges, buttons and card classes
  - md_in_html          # required for grid cards and the hero block
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true     # this was missing; content.tabs.link did nothing
  - pymdownx.tilde

# ------------------------------------------------------------------------------
# Plugins
#
# Only `search` is enabled, so the site builds with mkdocs-material alone.
# The rest are worth adding later — each needs a pip install first.
# ------------------------------------------------------------------------------

plugins:
  - search
  # - glightbox                      # pip install mkdocs-glightbox — zoomable images
  # - social                         # needs cairosvg + pillow — branded link previews
  # - git-revision-date-localized:   # pip install mkdocs-git-revision-date-localized-plugin
  #     enable_creation_date: false

# ------------------------------------------------------------------------------
# Link checking — warn, never fail the build
# ------------------------------------------------------------------------------

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# ------------------------------------------------------------------------------
# THE VAULT
#
# Everything listed here stays on your laptop and in git, but is not built,
# not published, and not searchable. Delete a line to release that module.
# ------------------------------------------------------------------------------

exclude_docs: |
  02-math/
  03-data/
  04-core-ml/
  05-dl-fundamentals/
  06-dl-architectures/
  07-nlp/
  08-llms/
  09-portfolio/

# ------------------------------------------------------------------------------
