      # ---- Opens 16 October. Delete t1-real-data/ from exclude_docs too.
      # - Real data:
      #     - t1-real-data/index.md
      #     - Web Scraping: t1-real-data/web-scraping.md
      #     - APIs: t1-real-data/apis.md
      #     - Data Preparation: t1-real-data/data-preparation.md
      #     - Data Preprocessing: t1-real-data/data-preprocessing.md

      # ---- Opens 16 November. Delete t1-models/ from exclude_docs too.
      # - Classic models:
      #     - t1-models/index.md
