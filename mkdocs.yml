      - Jupyter notebook setup: 01-tools/notebook-setup.md
      - VS Code setup: 01-tools/vscode-setup.md
      - Python warm up: 01-tools/python-warm-up.md

  - Fundamentals:
      - 02-fundamentals/index.md
      - What AI is: 02-fundamentals/what-is-ai.md
      - How machines learn: 02-fundamentals/what-is-ml.md
      - Framing a problem: 02-fundamentals/framing-ml-problems.md
      - Working with data: 02-fundamentals/working-with-data.md
      - Ethics and responsibility: 02-fundamentals/ethics-and-responsibility.md
